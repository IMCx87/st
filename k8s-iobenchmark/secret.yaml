  namespace: io-benchmark
  labels:
    app: iobenchmark
    managed-by: claude-code
  annotations:
    # Gerado por: claude-code — substitua os stubs antes de aplicar
    io-benchmark/usage: "S3/COSI storage credentials for io-generator pods"
type: Opaque
data:
  # TODO: base64 do endpoint S3/COSI  (ex: http://minio.example.com:9000)
  AWS_ENDPOINT_URL: ""        # TODO

  # TODO: base64 do nome do bucket
  BUCKET_NAME: ""             # TODO

  # TODO: base64 do access key ID
  AWS_ACCESS_KEY_ID: ""       # TODO

  # TODO: base64 do secret access key
  AWS_SECRET_ACCESS_KEY: ""   # TODO
