# ==============================================================
# SECRET — Credenciais S3 (usadas apenas com STORAGE_TYPE=s3)
# ==============================================================
# Preencha estes valores se for usar Nutanix Objects (S3-compatible)
# em vez de Nutanix Files/Volumes. Gere as chaves no Prism Central
# em Objects > <bucket> > Access Keys.
#
# Para codificar: echo -n "valor" | base64
#
# Após preencher, referencie no StatefulSet descomentando
# a seção de env vars S3 em statefulset.yaml.
# ==============================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: io-s3-credentials
  namespace: io-benchmark
  labels:
    app: iobenchmark
    managed-by: claude-code
  annotations:
    io-benchmark/usage: "Nutanix Objects (S3) credentials for io-generator pods"
type: Opaque
data:
  # TODO: base64 do endpoint do Nutanix Objects (ex: https://objects.example.com:9440)
  AWS_ENDPOINT_URL: ""        # TODO

  # TODO: base64 do nome do bucket criado no Prism Central > Objects
  BUCKET_NAME: ""             # TODO

  # TODO: base64 do Access Key gerado no bucket
  AWS_ACCESS_KEY_ID: ""       # TODO

  # TODO: base64 do Secret Key gerado no bucket
  AWS_SECRET_ACCESS_KEY: ""   # TODO
